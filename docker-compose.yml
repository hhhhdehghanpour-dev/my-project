services:

  db:
    image: postgres:16
    container_name: user-api-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-userdb}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: user-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-userdb}"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

    ports:
      - "3000:3000"

    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm start"


volumes:
  postgres_data: