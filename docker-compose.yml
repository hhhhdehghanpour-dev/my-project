services:

  db:
    image: postgres:16
    container_name: user-api-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: H09012890372h
      POSTGRES_DB: userdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build: .
    container_name: user-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://postgres:H09012890372h@db:5432/userdb"

    ports:
      - "3000:3000"

    command: sh -c "npx prisma migrate deploy && npm start"


volumes:
  postgres_data: