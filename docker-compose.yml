services:
  db:
    image: postgres:16
    container_name: user-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: H09012890372h
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: user-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"

volumes:
  postgres_data: